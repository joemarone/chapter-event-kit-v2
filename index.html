              <span className="trailer-url-val">{displayedUrl}</span>
              <button className="trailer-url-copy" onClick={() => { navigator.clipboard.writeText(displayedUrl); onCopy(`${isLandscape ? 'Landscape' : 'Portrait'} link copied`); }} title="Copy">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              </button>
            </div>
          )}
          <div className="trailer-actions">
            <button className="build-btn small" onClick={onOpen}>Preview full size</button>
            {hasShareableLink && (
              <button className="build-btn small outline" onClick={() => { navigator.clipboard.writeText(displayedUrl); onCopy(`${isLandscape ? 'Landscape' : 'Portrait'} link copied`); }}>Copy link</button>
            )}
          </div>
        </div>
      </div>

      {/* How to use with Circle — Spark version explains why there's no link to paste */}
      <div className="circle-howto">
        <div className="circle-howto-head">
          <span className="circle-dot">C</span>
          {isSpark && !youtubeUrl ? 'How this fits in the Circle post' : (isLandscape ? 'How to use this on Circle' : 'How to share this on Circle')}
        </div>
        {isSpark && !youtubeUrl ? (
          <ol>
            <li>Skip pasting a trailer link — Sparks don't ship with one. Use the <strong>cover banner</strong> from Stack 1 as the event header image instead.</li>
            <li>Paste the <strong>event description</strong> rich text into Circle's Details box. The SPARK anatomy at the top of the description gives parents the framing they'd otherwise get from a trailer.</li>
            <li>If you want a graphic to share in chat or social, the cover banner is your best asset — it's high-res, branded, and ready to go.</li>
          </ol>
        ) : isLandscape ? (
          <ol>
            <li>Open your chapter's <strong>Circle event</strong> → click <strong>Edit event</strong>.</li>
            <li>In the description, add an <strong>Embed</strong> block and paste the link above. Circle will auto-embed the video.</li>
            <li>Put the embed <strong>right below the cover image</strong> so it's the first thing parents see when they tap in.</li>
            <li>Post an announcement in the chapter space: <em>"Trailer's up — watch the 60-second look and RSVP."</em></li>
          </ol>
        ) : (
          <ol>
            <li>In your chapter's Circle space, open the <strong>chat channel</strong> (not the event) → paste the link as a new message.</li>
            <li>Also paste it into the <strong>member welcome DM</strong> for new parents joining the chapter — it sets the tone.</li>
            <li>For reach beyond Circle, save the link and share as an <strong>Instagram story</strong> or <strong>WhatsApp status</strong>. Tag the chapter.</li>
            <li>Pair it with a caption like: <code>Come make something real → link in Circle.</code></li>
          </ol>
        )}
      </div>
    </div>
  );
}

function VideoModal({ ratio, ctx, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const specs = ratio === 'landscape'
    ? { dim: '1920 × 1080', ar: '16:9' }
    : { dim: '1080 × 1920', ar: '9:16' };
  // When a real YouTube trailer is set for this orientation, embed it.
  // Otherwise fall back to the live React/CSS preview so nothing breaks
  // before the videos are recorded and pasted into the sheet.
  const youtubeEmbed = getYouTubeEmbedUrl(ctx.youtubeLandscape);
  return (
    <div className="video-modal" onClick={onClose}>
      <div className={`video-modal-stage ${ratio}`} onClick={(e) => e.stopPropagation()}>
        <button className="video-modal-close" onClick={onClose}>
          Close
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
        </button>
        {youtubeEmbed
          ? <iframe className="youtube-embed" src={youtubeEmbed} title={`${ctx.title} trailer`} allow="autoplay; encrypted-media; picture-in-picture" allowFullScreen frameBorder="0"/>
          : <TrailerWithIntro ctx={ctx} ratio={ratio} loop={true}/>}
        <div className="video-modal-footer">
          <div><strong>{ctx.title}</strong> · {youtubeEmbed ? 'YouTube' : '1:06'} · {specs.dim}</div>
          <div>{youtubeEmbed ? 'Press ESC or click outside to close' : 'Looping preview · press ESC to close'}</div>
        </div>
      </div>
    </div>
  );
}

// ============== TRAILER WITH BRANDED INTRO ==============
// Plays the 6-second branded mp4 first, then crossfades into the slide trailer.
// The intro and the slide trailer together form one "video." This is what gets
// exported when we ship MP4 generation in Phase B.
function TrailerWithIntro({ ctx, ratio, loop }) {
  const [introDone, setIntroDone] = useState(false);
  const videoRef = React.useRef(null);
  const introSrc = ratio === 'landscape'
    ? 'assets/intro/intro-landscape.mp4'
    : 'assets/intro/intro-portrait.mp4';

  useEffect(() => {
    // Reset on remount (e.g., when loop=false and parent recreates the component)
    setIntroDone(false);
  }, [ctx.title, ratio]);

  return (
    <div className="trailer-with-intro" data-ratio={ratio}>
      {!introDone && (
        <video
          ref={videoRef}
          className="trailer-intro-video"
          src={introSrc}
          autoPlay
          playsInline
          muted={false}
          onEnded={() => setIntroDone(true)}
          onError={() => { /* intro file missing — skip straight to trailer */ setIntroDone(true); }}
        />
      )}
      {introDone && <TrailerScene ctx={ctx} ratio={ratio}/>}
    </div>
  );
}

// ============== WORKSHOP PREVIEW MODAL ==============
// Shown when a parent clicks "Preview" on a workshop card on step 1.
// Plays the branded intro followed by the landscape trailer, then auto-closes.
// Click the backdrop or press ESC to dismiss early.
function WorkshopPreviewModal({ workshop, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  // Build a minimal preview ctx — the parent hasn't filled in chapter/date/etc yet.
  const ctx = {
    title: workshop.title,
    subtitle: workshop.oneLiner,
    skills: workshop.skills,
    ages: workshop.ages,
    duration: workshop.duration,
    groupSize: '8-12',
    chapter: 'Your Chapter',
    date: '',
    materials: workshop.materials || [],
    mastery: workshop.mastery || [],
  };

  // The per-tile preview shows the landscape trailer — same cut parents
  // see embedded in Circle, so the preview is a true "what you'll get".
  const youtubeEmbed = getYouTubeEmbedUrl(workshop.youtubeLandscape);
  return (
    <div className="video-modal" onClick={onClose}>
      <div className="video-modal-stage landscape preview-modal" onClick={(e) => e.stopPropagation()}>
        <button className="video-modal-close" onClick={onClose}>
          Close
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>
        </button>
        {youtubeEmbed
          ? <iframe className="youtube-embed" src={youtubeEmbed} title={`${workshop.title} trailer`} allow="autoplay; encrypted-media; picture-in-picture" allowFullScreen frameBorder="0"/>
          : <TrailerWithIntro ctx={ctx} ratio="landscape" loop={false} onComplete={onClose}/>}
        <div className="video-modal-footer">
          <div><strong>{workshop.title}</strong> · preview</div>
          <div>Click anywhere outside to close</div>
        </div>
      </div>
    </div>
  );
}

window.App = App;
</script>

<script type="text/babel">
  setTimeout(() => {
    ReactDOM.createRoot(document.getElementById('root')).render(<window.App/>);
  }, 150);
</script>
